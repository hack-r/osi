name: D1 nightly backup

# Replicates the live `whoneedsit` D1 database into `whoneedsit-backup`.
# The target is rebuilt from scratch each run and verified by row count, so a
# green run means the backup is known-good rather than merely attempted.

on:
  schedule:
    - cron: '17 8 * * *'   # 08:17 UTC daily
  workflow_dispatch:        # manual run from the Actions tab

# A run drops and rebuilds the target, so two overlapping runs would interleave
# their DROPs, CREATEs and INSERTs and could leave a mixed result that still
# verifies. Queue them instead; cancel-in-progress would abort a run midway
# through the rebuild, which is the state we least want to leave behind.
concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Report drift before replicating
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python d1_replicate.py --dry-run

      - name: Replicate and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python d1_replicate.py
