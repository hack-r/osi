<style>
* {

}

body {

  color: #1D2939;
  background: white;
}

.osi-table-title {
  margin: 0 0 5px 0;
  color: #17324D;
  font-size: 22px;
  line-height: 1.2;
}

.osi-table-subtitle {
  margin: 0 0 14px 0;
  color: #667085;
  font-size: 14px;
  line-height: 1.3;
}

table.osi-table {
  width: auto;
  max-width: 100%;
  border-collapse: collapse;
  border-spacing: 0;
  font-size: 15px;
  line-height: 1.3;
}

table.osi-table th,
table.osi-table td {
  padding: 8px 12px;
  border-bottom: 1px solid #D0D5DD;
  vertical-align: middle;
}

table.osi-table thead th {
  background: #17324D;
  color: white;
  font-weight: bold;
  text-align: left;
  white-space: nowrap;
}

table.osi-table tbody tr:nth-child(even) {
  background: #F7F9FB;
}

table.osi-table tbody tr:nth-child(odd) {
  background: white;
}

table.osi-table tbody td:first-child {
  text-align: left;
  white-space: normal;
}

table.osi-table tbody td:not(:first-child) {
  text-align: right;
  white-space: nowrap;
}
</style>
