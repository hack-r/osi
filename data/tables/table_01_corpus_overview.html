<!doctype html>
<html>
<head>
<meta charset="utf-8">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 24px;
  font-family: Arial, Helvetica, sans-serif;
  color: #1D2939;
  background: white;
}

.osi-table-title {
  margin: 0 0 5px 0;
  color: #17324D;
  font-size: 22px;
  line-height: 1.2;
}

.osi-table-subtitle {
  margin: 0 0 14px 0;
  color: #667085;
  font-size: 14px;
  line-height: 1.3;
}

table.osi-table {
  width: auto;
  max-width: 100%;
  border-collapse: collapse;
  border-spacing: 0;
  font-size: 15px;
  line-height: 1.3;
}

table.osi-table th,
table.osi-table td {
  padding: 8px 12px;
  border-bottom: 1px solid #D0D5DD;
  vertical-align: middle;
}

table.osi-table thead th {
  background: #17324D;
  color: white;
  font-weight: bold;
  text-align: left;
  white-space: nowrap;
}

table.osi-table tbody tr:nth-child(even) {
  background: #F7F9FB;
}

table.osi-table tbody tr:nth-child(odd) {
  background: white;
}

table.osi-table tbody td:first-child {
  text-align: left;
  white-space: normal;
}

table.osi-table tbody td:not(:first-child) {
  text-align: right;
  white-space: nowrap;
}
</style>

</head>
<body>
<h2 class="osi-table-title">Corpus overview</h2>
<p class="osi-table-subtitle">Summary of the OSI full-text article collection</p>
<table class="osi-table">
 <thead>
  <tr>
   <th style="text-align:left;"> Measure </th>
   <th style="text-align:left;"> Value </th>
  </tr>
 </thead>
<tbody>
  <tr>
   <td style="text-align:left;"> Full-text records </td>
   <td style="text-align:left;"> 1776 </td>
  </tr>
  <tr>
   <td style="text-align:left;"> Unique authors </td>
   <td style="text-align:left;"> 168 </td>
  </tr>
  <tr>
   <td style="text-align:left;"> Unique publications </td>
   <td style="text-align:left;"> 2 </td>
  </tr>
  <tr>
   <td style="text-align:left;"> Unique sections </td>
   <td style="text-align:left;"> 13 </td>
  </tr>
  <tr>
   <td style="text-align:left;"> Earliest publication year </td>
   <td style="text-align:left;"> 2,006 </td>
  </tr>
  <tr>
   <td style="text-align:left;"> Latest publication year </td>
   <td style="text-align:left;"> 2,026 </td>
  </tr>
  <tr>
   <td style="text-align:left;"> Median article length </td>
   <td style="text-align:left;"> 61 </td>
  </tr>
  <tr>
   <td style="text-align:left;"> Total analyzed words </td>
   <td style="text-align:left;"> 1,007,751 </td>
  </tr>
</tbody>
</table>
</body>
</html>
